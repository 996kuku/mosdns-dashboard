<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,shrink-to-fit=no">
<meta name="robots" content="noindex,nofollow">
<title>登入 · MosDNS 仪表盘</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%235eba00'/%3E%3Ctext x='16' y='23' font-size='19' font-weight='700' text-anchor='middle' fill='%23fff' font-family='Segoe UI,Helvetica Neue,Arial,sans-serif'%3ED%3C/text%3E%3C/svg%3E">
<style>
/* 配色取自 AdGuard Home 登录页：浅色 #f5f7fb / 深色 #131313，主色 #5eba00 */
:root{
  --bg:#f5f7fb; --card:#fff; --bd:rgba(0,40,100,.12);
  --tx:#495057; --hd:#212529;
  --in-bg:#fff; --in-bd:rgba(0,40,100,.12);
  --focus:#1991eb; --focus-sh:rgba(70,127,207,.25);
  --green:#5eba00; --green-h:#54a800; --green-a:#4a9500;
  --muted:#6e7687; --err:#d7263d; --err-bg:rgba(215,38,61,.08); --err-bd:rgba(215,38,61,.32);
}
body[data-theme="dark"]{
  --bg:#131313; --card:#1c1c1c; --bd:#3d3d3d;
  --tx:#e6e6e6; --hd:#fff;
  --in-bg:#1c1c1c; --in-bd:#3d3d3d;
  --muted:#8b8b8b; --err:#ff6b7a; --err-bg:rgba(255,107,122,.10); --err-bd:rgba(255,107,122,.34);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%}
body{
  background:var(--bg);color:var(--tx);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",
       "PingFang SC","Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.login{min-height:100vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:40px 20px;text-align:center}
.login__wrap{width:354px;max-width:100%}
.login__logo{margin-bottom:24px;line-height:0}
.login__logo svg{display:inline-block}
/* 卡片：354 宽 / 圆角 3px / 内边距 32px，与 AdGuard Home 一致 */
.card{display:block;width:100%;background:var(--card);
  border:1px solid var(--bd);border-radius:3px;
  box-shadow:0 1px 2px rgba(0,0,0,.05);text-align:left}
.card-body{padding:32px}
.alert{margin:0 0 16px;padding:8px 12px;font-size:13px;line-height:1.45;
  color:var(--err);background:var(--err-bg);border:1px solid var(--err-bd);border-radius:3px}
.form-group{margin-bottom:16px}
.form-group:last-of-type{margin-bottom:0}
.form-label{display:block;margin-bottom:8px;font-size:15px;font-weight:400;color:var(--tx)}
/* 注意：font 简写的 family 位不能写 inherit（整条声明会被丢弃），必须拆开写 */
.form-control{display:block;width:100%;height:38px;padding:6px 12px;
  font-size:15px;line-height:1.5;font-family:inherit;
  color:var(--tx);background:var(--in-bg);
  border:1px solid var(--in-bd);border-radius:3px;
  transition:border-color .15s ease-in-out,box-shadow .15s ease-in-out}
.form-control::placeholder{color:var(--muted);opacity:1}
.form-control:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 2px var(--focus-sh)}
.form-footer{margin-top:32px}
.btn{display:block;width:100%;height:38px;padding:6px 12px;
  font-size:13px;line-height:1.5;font-family:inherit;font-weight:600;
  letter-spacing:.39px;text-align:center;
  color:#fff;background:var(--green);border:1px solid var(--green);border-radius:3px;
  cursor:pointer;transition:background .15s,border-color .15s}
.btn:hover{background:var(--green-h);border-color:var(--green-h)}
.btn:active{background:var(--green-a);border-color:var(--green-a)}
.btn:focus{outline:none;box-shadow:0 0 0 2px var(--focus-sh)}
.btn[disabled]{opacity:.6;cursor:default}
.login__foot{margin-top:24px;font-size:14px;color:var(--muted);line-height:1.7}
.login__foot b{font-weight:400;color:var(--tx)}
.login__foot code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;
  background:var(--card);border:1px solid var(--bd);border-radius:3px;padding:1px 5px}
/* 页脚备案 / 友情链接：颜色走 --muted，深浅主题都可读，不写死浅色 hex */
.login__foot a{color:var(--muted);text-decoration:none;
  border-bottom:1px solid rgba(127,140,160,.45);transition:color .15s,border-color .15s}
.login__foot a:hover{color:var(--green);border-bottom-color:var(--green)}
.login__meta{margin-top:10px;padding-top:9px;border-top:1px solid var(--bd);
  font-size:13px;line-height:1.6}
.login__meta .sep{margin:0 7px;opacity:.55}
/* 站点介绍：13px + --muted，与页脚同调；跟上一行留 8px */
.login__about{margin:8px auto 0;max-width:330px;font-size:13px;line-height:1.75;color:var(--muted)}
@media (max-width:420px){
  .login{padding:24px 12px}
  .login__wrap{width:100%}
  .card-body{padding:24px}
}
</style>
</head>
<body>
<script>
/* 与 AdGuard Home 相同：跟随系统深浅色，写进 body[data-theme] */
(function(){
  var d = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.body.dataset.theme = d ? 'dark' : 'light';
})();
</script>

<div class="login">
  <div class="login__wrap">
    <div class="login__logo">
      <svg xmlns="http://www.w3.org/2000/svg" width="164" height="41" viewBox="0 0 164 41" role="img" aria-label="MosDNS 仪表盘">
        <rect x="2" y="5" width="30" height="30" rx="7" fill="#5eba00"/>
        <text x="17" y="27" font-size="18" font-weight="700" text-anchor="middle" fill="#fff"
              font-family="Segoe UI,Helvetica Neue,Arial,sans-serif">D</text>
        <text x="41" y="20" font-size="17" font-weight="700" fill="currentColor"
              font-family="Segoe UI,Helvetica Neue,PingFang SC,Microsoft YaHei,Arial,sans-serif">MosDNS</text>
        <text x="41" y="35" font-size="11" fill="var(--muted)"
              font-family="Segoe UI,Helvetica Neue,PingFang SC,Microsoft YaHei,Arial,sans-serif">仪表盘</text>
      </svg>
    </div>

    <form class="card" method="post" action="/api/login" autocomplete="on" novalidate>
      <div class="card-body">
        <!--__ERR__-->
        <div class="form-group">
          <label class="form-label" for="u">用户名</label>
          <input class="form-control" id="u" name="username" type="text"
                 placeholder="输入用户名" autocomplete="username" autocapitalize="off"
                 spellcheck="false" value="__USER__">
        </div>
        <div class="form-group">
          <label class="form-label" for="p">密码</label>
          <input class="form-control" id="p" name="password" type="password"
                 placeholder="输入密码" autocomplete="current-password">
        </div>
        <div class="form-footer">
          <button class="btn" type="submit">登入</button>
        </div>
      </div>
    </form>

    <div class="login__foot">
      <b>MosDNS 仪表盘</b> · 仅授权访问<br>
      忘记密码？在面板主机上执行 <code>dashboard-setpass</code> 重设
      <div class="login__about">
        <a href="https://www.997wan.com/" target="_blank" rel="noopener noreferrer">997笔记</a>
        —— 记录软路由 OpenWrt、Linux 命令与家庭网络运维的折腾过程，
        这套仪表盘的搭建思路与排坑记录也都写在上面。
      </div>
      <div class="login__meta">
        <a href="https://www.997wan.com/" target="_blank" rel="noopener noreferrer">www.997wan.com</a>
        <span class="sep">·</span>
        <a href="https://www.997wan.com/" target="_blank" rel="noopener noreferrer">997笔记</a>
      </div>
    </div>
  </div>
</div>
</body>
</html>
